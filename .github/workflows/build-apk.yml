name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p www && echo '<html><body>ClipGrab</body></html>' > www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.clipgrab.app",
            "appName": "ClipGrab",
            "webDir": "www",
            "server": { "url": "https://clipgrab-53p8.onrender.com" }
          }
          JSON
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ github.run_number }}\"/" android/app/build.gradle
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          base64 -d debug.keystore.b64 > ~/.android/debug.keystore
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ClipGrab.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ClipGrab v${{ github.run_number }}
          files: ClipGrab.apk
          make_latest: true
