name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p www && echo '<html><body>ClipGrab</body></html>' > www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.clipgrab.app",
            "appName": "ClipGrab",
            "webDir": "www",
            "server": { "url": "https://clipgrab-53p8.onrender.com" }
          }
          JSON
          npx cap add android
          npx cap sync android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" /></manifest>#' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/clipgrab/app/MainActivity.java <<'JAVA'
          package com.clipgrab.app;

          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              getBridge().getWebView().addJavascriptInterface(new Native(), "ClipNative");
              getBridge().getWebView().addJavascriptInterface(new YtNative(this), "ClipYT"); //YT
            }

            class Native {
              private DownloadManager dm() { return (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE); }

              private boolean ok(String u) {
                try {
                  String h = Uri.parse(u).getHost();
                  return h != null && (h.equals("clipgrab-53p8.onrender.com") || h.equals("github.com") || h.endsWith(".githubusercontent.com"));
                } catch (Exception e) { return false; }
              }

              @JavascriptInterface
              public long download(String url, String name) {
                if (!ok(url)) return -1;
                DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                r.setTitle(name);
                r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                return dm().enqueue(r);
              }

              @JavascriptInterface
              public String status(long id) {
                Cursor c = dm().query(new DownloadManager.Query().setFilterById(id));
                try {
                  if (c != null && c.moveToFirst()) {
                    return c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS)) + ","
                        + c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR)) + ","
                        + c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                  }
                } finally { if (c != null) c.close(); }
                return "0,0,0";
              }

              @JavascriptInterface
              public void cancel(long id) { dm().remove(id); }

              @JavascriptInterface
              public boolean open(long id, String mime) {
                Uri u = dm().getUriForDownloadedFile(id);
                if (u == null) return false;
                Intent i = new Intent(Intent.ACTION_VIEW);
                i.setDataAndType(u, mime);
                i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                try { startActivity(i); return true; } catch (Exception e) { return false; }
              }

              @JavascriptInterface
              public boolean exists(long id) {
                Uri u = dm().getUriForDownloadedFile(id);
                if (u == null) return false;
                try { getContentResolver().openFileDescriptor(u, "r").close(); return true; } catch (Exception e) { return false; }
              }

              @JavascriptInterface
              public boolean share(long id, String mime) {
                Uri u = dm().getUriForDownloadedFile(id);
                if (u == null) return false;
                Intent i = new Intent(Intent.ACTION_SEND);
                i.setType(mime);
                i.putExtra(Intent.EXTRA_STREAM, u);
                i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                try {
                  Intent c = Intent.createChooser(i, "Share");
                  c.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(c);
                  return true;
                } catch (Exception e) { return false; }
              }

              @JavascriptInterface
              public void folder() {
                Intent i = new Intent(DownloadManager.ACTION_VIEW_DOWNLOADS);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try { startActivity(i); } catch (Exception e) {}
              }
            }
          }
          JAVA
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle || { echo "versionCode patch failed"; exit 1; }
      - name: Add on-phone YouTube engine (yt-dlp + ffmpeg)
        run: |
          cp android-extra/YtNative.java android/app/src/main/java/com/clipgrab/app/YtNative.java
          # library needs minSdk 24 and native libs extracted to disk
          sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 24/' android/variables.gradle
          sed -i 's#<application#<application android:extractNativeLibs="true"#' android/app/src/main/AndroidManifest.xml
          sed -i '0,/^android {/s//android {\n    packagingOptions { jniLibs { useLegacyPackaging true } }/' android/app/build.gradle
          sed -i '0,/defaultConfig {/s//defaultConfig {\n        ndk { abiFilters "arm64-v8a" }/' android/app/build.gradle
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"\n    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"/' android/app/build.gradle
          grep -n "junkfood02\|useLegacyPackaging\|abiFilters" android/app/build.gradle
          grep -n "minSdkVersion" android/variables.gradle
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          KS=$(ls debug*keystore*.b64 | head -1)
          echo "Using $KS"
          base64 -d "$KS" > ~/.android/debug.keystore
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if ! ./gradlew assembleDebug; then
            echo "::warning::Build with the on-phone YouTube engine failed. Retrying without it (YouTube will use the server engine)."
            cd ..
            bash android-extra/strip-yt.sh
            cd android
            ./gradlew assembleDebug
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../ClipGrab.apk
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs ../ClipGrab.apk | grep -i "SHA-256" || true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ClipGrab v${{ github.run_number }}
          files: ClipGrab.apk
          make_latest: true
