name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # SHA-256 of debug_keystore.b64. Every APK MUST carry this cert, otherwise Android refuses to update over the old app.
      EXPECTED_SHA256: "76:44:13:0B:33:82:37:6A:E4:F6:9E:BE:1E:1C:D7:4C:E7:AB:52:99:78:37:7F:F1:B7:5B:49:37:E6:AA:B8:B1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p www && echo '<html><body>ClipGrab</body></html>' > www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.clipgrab.app",
            "appName": "ClipGrab",
            "webDir": "www",
            "server": { "url": "https://clipgrab-53p8.onrender.com" }
          }
          JSON
          npx cap add android
          npx cap sync android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" /></manifest>#' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/clipgrab/app/MainActivity.java <<'JAVA'
          package com.clipgrab.app;

          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              getBridge().getWebView().addJavascriptInterface(new Native(), "ClipNative");
              getBridge().getWebView().addJavascriptInterface(new YtNative(this), "ClipYT"); //YT
              if (android.os.Build.VERSION.SDK_INT >= 33) { try { requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 7); } catch (Exception e) {} }
            }

            class Native {
              private DownloadManager dm() { return (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE); }

              private boolean ok(String u) {
                try {
                  String h = Uri.parse(u).getHost();
                  return h != null && (h.equals("clipgrab-53p8.onrender.com") || h.equals("github.com") || h.endsWith(".githubusercontent.com"));
                } catch (Exception e) { return false; }
              }

              @JavascriptInterface
              public long download(String url, String name) {
                if (!ok(url)) return -1;
                DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                r.setTitle(name);
                r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                return dm().enqueue(r);
              }

              @JavascriptInterface
              public String status(long id) {
                Cursor c = dm().query(new DownloadManager.Query().setFilterById(id));
                try {
                  if (c != null && c.moveToFirst()) {
                    return c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS)) + ","
                        + c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR)) + ","
                        + c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                  }
                } finally { if (c != null) c.close(); }
                return "0,0,0";
              }

              @JavascriptInterface
              public void cancel(long id) { dm().remove(id); }

              @JavascriptInterface
              public boolean open(long id, String mime) {
                Uri u = dm().getUriForDownloadedFile(id);
                if (u == null) return false;
                Intent i = new Intent(Intent.ACTION_VIEW);
                i.setDataAndType(u, mime);
                i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                try { startActivity(i); return true; } catch (Exception e) { return false; }
              }

              @JavascriptInterface
              public boolean exists(long id) {
                Uri u = dm().getUriForDownloadedFile(id);
                if (u == null) return false;
                try { getContentResolver().openFileDescriptor(u, "r").close(); return true; } catch (Exception e) { return false; }
              }

              @JavascriptInterface
              public boolean share(long id, String mime) {
                Uri u = dm().getUriForDownloadedFile(id);
                if (u == null) return false;
                Intent i = new Intent(Intent.ACTION_SEND);
                i.setType(mime);
                i.putExtra(Intent.EXTRA_STREAM, u);
                i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                try {
                  Intent c = Intent.createChooser(i, "Share");
                  c.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(c);
                  return true;
                } catch (Exception e) { return false; }
              }

              @JavascriptInterface
              public void folder() {
                Intent i = new Intent(DownloadManager.ACTION_VIEW_DOWNLOADS);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                try { startActivity(i); } catch (Exception e) {}
              }
            }
          }
          JAVA
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle || { echo "versionCode patch failed"; exit 1; }
      - name: Add on-phone YouTube engine (yt-dlp + ffmpeg)
        run: |
          cp android-extra/YtNative.java android/app/src/main/java/com/clipgrab/app/YtNative.java
          cp android-extra/Mux.java android/app/src/main/java/com/clipgrab/app/Mux.java
          # keep downloads running in the background (foreground service + notification)
          cp android-extra/DlService.java android/app/src/main/java/com/clipgrab/app/DlService.java
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" /><uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" /><uses-permission android:name="android.permission.POST_NOTIFICATIONS" /><uses-permission android:name="android.permission.WAKE_LOCK" /></manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<service android:name=".DlService" android:foregroundServiceType="dataSync" android:exported="false" /></application>#' android/app/src/main/AndroidManifest.xml
          # library needs minSdk 24 and native libs extracted to disk
          sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 24/' android/variables.gradle
          sed -i 's#<application#<application android:extractNativeLibs="true"#' android/app/src/main/AndroidManifest.xml
          sed -i '0,/^android {/s//android {\n    packagingOptions { jniLibs { useLegacyPackaging true } }/' android/app/build.gradle
          sed -i '0,/defaultConfig {/s//defaultConfig {\n        ndk { abiFilters "arm64-v8a" }/' android/app/build.gradle
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"\n    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"/' android/app/build.gradle
          # ffmpeg fix: the ffmpeg package of youtubedl-android 0.18.1 forgot libc++_shared.so, so ffmpeg can't start
          # (merging video+audio and cutting then fail). Ship it from the NDK; YtNative copies it next to ffmpeg's libs.
          NDK_SO=""
          for d in "$ANDROID_NDK_ROOT" "$ANDROID_NDK_HOME" "$ANDROID_NDK_LATEST_HOME" "$ANDROID_HOME/ndk"; do
            [ -n "$d" ] && [ -d "$d" ] || continue
            NDK_SO=$(find "$d" -path '*aarch64-linux-android*' -name 'libc++_shared.so' 2>/dev/null | head -1 || true)
            [ -n "$NDK_SO" ] && break
          done
          if [ -n "$NDK_SO" ]; then
            mkdir -p android/app/src/main/jniLibs/arm64-v8a
            cp "$NDK_SO" android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
            echo "libc++_shared.so copied from $NDK_SO"
          else
            echo "::warning::libc++_shared.so not found in the NDK. ffmpeg may not start; the built-in merger will be used instead."
          fi
          python3 - <<'PY'
          p = "android/app/build.gradle"
          s = open(p).read()
          line = "    packagingOptions { jniLibs { pickFirsts.add('**/libc++_shared.so') } } // CPP\n"
          assert "android {\n" in s
          s = s.replace("android {\n", "android {\n" + line, 1)
          open(p, "w").write(s)
          PY
          grep -n "junkfood02\|useLegacyPackaging\|abiFilters\|CPP" android/app/build.gradle
          grep -n "minSdkVersion" android/variables.gradle
          ls -la android/app/src/main/jniLibs/arm64-v8a 2>/dev/null || true
      - name: Use fixed signing key
        run: |
          set -e
          KS=$(ls debug*keystore*.b64 | head -1)
          echo "Using $KS"
          mkdir -p "$GITHUB_WORKSPACE/signing" ~/.android
          base64 -d "$KS" > "$GITHUB_WORKSPACE/signing/debug.keystore"
          cp "$GITHUB_WORKSPACE/signing/debug.keystore" ~/.android/debug.keystore
          GOT=$(keytool -list -v -keystore "$GITHUB_WORKSPACE/signing/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
          echo "Keystore SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED_SHA256" ]; then
            echo "::error::The signing keystore changed. Phones with the old app would get 'App not installed'. Restore the original debug_keystore.b64."
            exit 1
          fi
          # Tell Gradle explicitly which key to sign with (do not rely on ~/.android being picked up)
          python3 - <<'PY'
          import os, re
          p = "android/app/build.gradle"
          s = open(p).read()
          ks = os.environ["GITHUB_WORKSPACE"] + "/signing/debug.keystore"
          blk = ('android {\n    signingConfigs {\n        debug {\n            storeFile file("%s")\n'
                 '            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n' % ks)
          assert re.search(r"^android \{\n", s, re.M), "android block not found"
          s = re.sub(r"^android \{\n", lambda m: blk, s, count=1, flags=re.M)
          open(p, "w").write(s)
          PY
          grep -n -A7 "signingConfigs" android/app/build.gradle
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          if ! ./gradlew assembleDebug; then
            echo "::warning::Build failed. Retrying without the newest extras (built-in merger, ffmpeg libc++ fix)."
            cd ..
            bash android-extra/strip-yt.sh new
            cd android
            if ! ./gradlew assembleDebug; then
              echo "::warning::Build with the on-phone YouTube engine failed. Retrying without it (YouTube will use the server engine)."
              cd ..
              bash android-extra/strip-yt.sh
              cd android
              ./gradlew assembleDebug
            fi
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../ClipGrab.apk
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          OUT=$($APKSIGNER verify --print-certs ../ClipGrab.apk)
          echo "$OUT" | grep -i "SHA-256"
          GOT=$(echo "$OUT" | grep -i 'certificate SHA-256 digest' | head -1 | sed 's/.*: *//' | tr 'A-F' 'a-f')
          WANT=$(echo "$EXPECTED_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::APK is signed with the wrong key ($GOT). It would fail to update on phones. Not publishing."
            exit 1
          fi
          echo "Signing key OK: $GOT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ClipGrab v${{ github.run_number }}
          body: "Signing certificate SHA-256: ${{ env.EXPECTED_SHA256 }}"
          files: ClipGrab.apk
          make_latest: true
