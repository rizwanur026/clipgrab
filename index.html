<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipGrab – HD video downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f24;--surface:#171a3a;--line:#2a2e5c;--text:#eceeff;--mute:#9aa0d0;--accent:#7c5cff;--mint:#3de0c4;--err:#ff7a8a}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 500px at 80% -10%,#2a2170 0%,transparent 60%),var(--bg);color:var(--text);font:16px/1.6 'DM Sans',system-ui,sans-serif;min-height:100vh;padding:28px 18px 60px}
main{max-width:560px;margin:0 auto}
.brand{font:800 20px 'Sora',sans-serif;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--mint))}
h1{font:800 clamp(34px,9vw,52px)/1.05 'Sora',sans-serif;letter-spacing:-.035em;margin:56px 0 14px}
.sub{color:var(--mute);max-width:44ch;margin-bottom:30px}
.box{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px #7c5cff30}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;padding:0 10px}
button{font:700 15px 'Sora',sans-serif;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;color:#fff;background:var(--accent);transition:transform .15s,filter .2s}
button:hover{filter:brightness(1.12)}button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
button.ghost{background:#252a5a;color:var(--text)}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;color:var(--err);min-height:24px;font-size:15px}
.card{display:none;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.card.on{display:block;animation:rise .45s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){.card.on{animation:none}}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;background:#0d0f24;display:block}
.body{padding:20px}
.title{font:700 18px/1.35 'Sora',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--mute);font-size:14px;margin:6px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{background:none;border:1px solid var(--line);color:var(--mute);padding:8px 14px;border-radius:999px;font:500 14px 'DM Sans',sans-serif}
.chip[aria-pressed=true]{background:var(--mint);border-color:var(--mint);color:#06241f;font-weight:700}
.go{width:100%;padding:16px;font-size:16px;background:linear-gradient(135deg,var(--accent),#a45cff)}
.note{margin-top:34px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="brand"><i></i>ClipGrab</div>
  <h1>Save any reel in full HD.</h1>
  <p class="sub">Paste an Instagram, TikTok or Facebook link. We fetch the best quality available, no watermark where the platform allows it.</p>

  <div class="box">
    <input id="url" type="url" placeholder="Paste video link" aria-label="Video link" autocomplete="off">
    <button class="ghost" id="paste" type="button">Paste</button>
    <button id="fetch" type="button">Fetch</button>
  </div>
  <p class="msg" id="msg" role="alert"></p>

  <section class="card" id="card">
    <img class="thumb" id="thumb" alt="" referrerpolicy="no-referrer">
    <div class="body">
      <p class="title" id="title"></p>
      <p class="meta" id="meta"></p>
      <div class="chips" id="chips"></div>
      <button class="go" id="dl" type="button">Download video</button>
    </div>
  </section>

  <p class="note">Only download videos you own or have permission to use.</p>
</main>
<script>
// Leave empty when Flask serves this page. For GitHub Pages, set your backend URL, e.g. "https://clipgrab.onrender.com"
const API = "";
const $ = id => document.getElementById(id);
let quality = "best";

const say = t => $("msg").textContent = t || "";
const mmss = s => s ? Math.floor(s/60) + ":" + String(Math.round(s%60)).padStart(2,"0") : "";

$("paste").onclick = async () => {
  try { $("url").value = await navigator.clipboard.readText(); $("fetch").click(); }
  catch { say("Clipboard is blocked. Paste the link manually."); }
};

$("fetch").onclick = async () => {
  const url = $("url").value.trim();
  if (!url) return say("Paste a link first.");
  say(""); $("card").classList.remove("on");
  $("fetch").disabled = true; $("fetch").textContent = "Fetching…";
  try {
    const r = await fetch(API + "/api/info", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    $("thumb").src = d.thumbnail || "";
    $("title").textContent = d.title;
    $("meta").textContent = [d.author, mmss(d.duration)].filter(Boolean).join("  |  ");
    const opts = [["best","Best"], ...d.heights.map(h => [String(h), h + "p"])];
    quality = "best";
    $("chips").innerHTML = "";
    opts.forEach(([v,l]) => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = l; b.setAttribute("aria-pressed", v === "best");
      b.onclick = () => { quality = v; [...$("chips").children].forEach(c => c.setAttribute("aria-pressed", c === b)); };
      $("chips").appendChild(b);
    });
    $("card").classList.add("on");
  } catch (e) { say(e.message || "Something went wrong. Check your connection."); }
  $("fetch").disabled = false; $("fetch").textContent = "Fetch";
};

$("dl").onclick = () => {
  const u = API + "/api/download?q=" + quality + "&url=" + encodeURIComponent($("url").value.trim());
  $("dl").textContent = "Preparing your file…";
  window.location.href = u;
  setTimeout(() => $("dl").textContent = "Download video", 6000);
};
$("url").addEventListener("keydown", e => e.key === "Enter" && $("fetch").click());
</script>
</body>
</html>
