<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipGrab AI Enhance (browser)</title>
<style>
:root{--bg:#0d0b1a;--card:#17142a;--line:#2d2850;--tx:#f1eefc;--mu:#a49fc4;--ac:#a855f7;--ac2:#ec4899;--ok:#34d399;--er:#fb7185}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;color:var(--mu);font-size:14px;margin:12px 0 4px}
select,input[type=file]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#100e20;color:var(--tx);font:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--tx);font-size:15px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2))}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
button:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
progress{width:100%;height:12px;margin-top:14px;accent-color:var(--ac)}
#st{margin:8px 0 0;color:var(--mu);font-size:14px;min-height:21px}
#er{color:var(--er);margin-top:10px}
.note{color:var(--mu);font-size:13px}
video{width:100%;border-radius:12px;background:#000;margin-top:12px}
a.dl{display:inline-block;margin-top:12px;text-decoration:none;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));padding:12px 18px;border-radius:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>AI Enhance</h1>
  <p class="sub">Runs inside your browser on your own computer. Nothing is uploaded. Use Chrome or Edge on a PC.</p>

  <div class="card">
    <label for="f">Choose a video</label>
    <input type="file" id="f" accept="video/*">
    <p class="note" id="meta" style="margin-top:10px" hidden></p>

    <div id="opts" hidden>
      <div class="row">
        <div><label for="tgt">Output size</label>
          <select id="tgt"><option value="720">720p</option><option value="1080" selected>1080p (Full HD)</option><option value="1440">1440p (2K)</option></select></div>
        <div><label for="fps">Frame rate</label>
          <select id="fps"><option value="15">15 (fastest)</option><option value="24">24</option><option value="30" selected>30</option></select></div>
      </div>
      <label class="chk"><input type="checkbox" id="prev" checked> Test only the first 3 seconds (recommended first)</label>
      <div class="btns">
        <button id="go" type="button">Enhance</button>
        <button id="stop" type="button" class="ghost" hidden>Stop</button>
      </div>
      <p class="note" style="margin-top:12px">The AI works on every frame, so it is slow on an older graphics chip. Try the 3-second test first and see how long it takes.</p>
    </div>

    <progress id="pg" value="0" max="100" hidden></progress>
    <p id="st"></p>
    <p id="er" hidden></p>
  </div>

  <div class="card" id="res" hidden>
    <strong>Done</strong>
    <video id="out" controls playsinline></video>
    <a class="dl" id="dl" download="enhanced.mp4">Download the enhanced video</a>
  </div>
</main>

<script type="module">
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const even = n => Math.max(2, Math.round(n / 2) * 2);
let stopFlag = false, busy = false, file = null, vinfo = null;

const setSt = t => { $("st").textContent = t; };
const setErr = t => { $("er").hidden = !t; $("er").textContent = t || ""; };
const fmtT = s => s >= 60 ? Math.ceil(s / 60) + " min" : Math.ceil(s) + " s";

/* ---------- libraries (loaded only when needed) ---------- */
let libs = null;
async function loadLibs() {
  if (libs) return libs;
  setSt("Loading the AI engine (first time only, about 10–20 MB)…");
  try {
    const [u, m, mm] = await Promise.all([
      import("https://esm.sh/upscaler@1.0.0"),
      import("https://esm.sh/@upscalerjs/esrgan-slim@1.0.0/2x"),
      import("https://esm.sh/mp4-muxer@5.1.3")
    ]);
    const Upscaler = u.default || u.Upscaler;
    libs = { upscaler: new Upscaler({ model: m.default || m }), Muxer: mm.Muxer, Target: mm.ArrayBufferTarget };
    return libs;
  } catch (e) {
    throw new Error("Couldn’t load the AI engine. Check your internet and try again. (" + (e && e.message || e) + ")");
  }
}

/* ---------- picking the file ---------- */
$("f").onchange = async () => {
  setErr(""); $("res").hidden = true; $("opts").hidden = true; $("meta").hidden = true;
  file = $("f").files[0];
  if (!file) return;
  try {
    const v = await openVideo(file);
    vinfo = { w: v.videoWidth, h: v.videoHeight, dur: v.duration };
    URL.revokeObjectURL(v.src);
    const short = Math.min(vinfo.w, vinfo.h);
    $("meta").hidden = false;
    $("meta").textContent = `${file.name} · ${vinfo.w}×${vinfo.h} · ${Math.round(vinfo.dur)} s · ${(file.size / 1048576).toFixed(1)} MB`;
    for (const o of $("tgt").options) o.disabled = +o.value <= short;
    const first = [...$("tgt").options].find(o => !o.disabled);
    if (!first) { setErr(`This video is already ${short}p or bigger. The AI works on smaller clips.`); return; }
    if ($("tgt").selectedOptions[0].disabled) $("tgt").value = first.value;
    $("opts").hidden = false;
  } catch (e) { setErr(e.message || String(e)); }
};

function openVideo(f) {
  return new Promise((res, rej) => {
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onloadeddata = () => res(v);
    v.onerror = () => rej(new Error("The browser can’t read this video. Try an MP4 (H.264)."));
    v.src = URL.createObjectURL(f);
  });
}

function seekTo(v, t) {
  return new Promise((res, rej) => {
    const ok = () => { v.removeEventListener("seeked", ok); res(); };
    v.addEventListener("seeked", ok);
    v.onerror = () => rej(new Error("Reading the video failed"));
    v.currentTime = t;
  });
}

/* ---------- the job ---------- */
$("stop").onclick = () => { stopFlag = true; setSt("Stopping…"); };
$("go").onclick = async () => {
  if (busy || !file) return;
  busy = true; stopFlag = false; setErr(""); $("res").hidden = true;
  $("go").disabled = true; $("stop").hidden = false; $("pg").hidden = false; $("pg").value = 0;
  let v = null;
  try {
    if (!("VideoEncoder" in window) || !("VideoFrame" in window)) throw new Error("This browser can’t encode video. Use the latest Chrome or Edge on a PC.");
    const { upscaler, Muxer, Target } = await loadLibs();

    v = await openVideo(file);
    const w = v.videoWidth, h = v.videoHeight;
    const target = +$("tgt").value, fps = +$("fps").value;
    const short = Math.min(w, h);
    if (target <= short) throw new Error("This video is already " + short + "p. Choose a bigger size.");
    const f = target / short;
    const OW = even(w * f), OH = even(h * f);
    const maxDur = $("prev").checked ? Math.min(3, v.duration) : v.duration;
    const n = Math.max(1, Math.floor(maxDur * fps));
    const bitrate = Math.round(Math.min(40e6, Math.max(8e6, OW * OH * fps * 0.2)));

    // pick an H.264 level this PC can encode
    let codec = null;
    for (const c of OW * OH <= 2097152 ? ["avc1.640028", "avc1.4d0028", "avc1.42002a"] : ["avc1.640033", "avc1.640032", "avc1.4d0033"]) {
      try {
        const s = await VideoEncoder.isConfigSupported({ codec: c, width: OW, height: OH, bitrate, framerate: fps });
        if (s.supported) { codec = c; break; }
      } catch (e) { /* try the next one */ }
    }
    if (!codec) throw new Error("This browser can’t encode " + OW + "×" + OH + " video. Pick a smaller size.");

    // sound: decode it, so we can put it back
    let audio = null;
    try {
      if ("AudioEncoder" in window) {
        setSt("Reading the sound…");
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const buf = await ac.decodeAudioData(await file.arrayBuffer());
        ac.close();
        const ch = Math.min(2, buf.numberOfChannels);
        const cfg = { codec: "mp4a.40.2", sampleRate: buf.sampleRate, numberOfChannels: ch, bitrate: 128000 };
        const sup = await AudioEncoder.isConfigSupported(cfg);
        if (sup.supported) audio = { buf, ch, cfg };
      }
    } catch (e) { audio = null; }

    const muxer = new Muxer({
      target: new Target(),
      video: { codec: "avc", width: OW, height: OH },
      audio: audio ? { codec: "aac", numberOfChannels: audio.ch, sampleRate: audio.cfg.sampleRate } : undefined,
      fastStart: "in-memory"
    });
    let encErr = null;
    const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { encErr = e; } });
    enc.configure({ codec, width: OW, height: OH, bitrate, framerate: fps });

    const src = document.createElement("canvas"); src.width = w; src.height = h;
    const sctx = src.getContext("2d", { willReadFrequently: false });
    const oc = document.createElement("canvas"); oc.width = OW; oc.height = OH;
    const octx = oc.getContext("2d");
    octx.imageSmoothingQuality = "high";

    const t0 = performance.now();
    for (let i = 0; i < n; i++) {
      if (stopFlag) throw new Error("Stopped");
      if (encErr) throw new Error("Video encoder error: " + encErr.message);
      await seekTo(v, Math.min(i / fps + 0.001, Math.max(0, v.duration - 0.001)));
      sctx.drawImage(v, 0, 0, w, h);
      const out = await upscaler.upscale(src, { patchSize: 64, padding: 4 });
      const img = new Image();
      img.src = typeof out === "string" ? out : URL.createObjectURL(out);
      await img.decode();
      octx.drawImage(img, 0, 0, OW, OH);
      const fr = new VideoFrame(oc, { timestamp: Math.round(i * 1e6 / fps) });
      enc.encode(fr, { keyFrame: i % fps === 0 });
      fr.close();
      while (enc.encodeQueueSize > 4) await sleep(10);
      const done = i + 1, el = (performance.now() - t0) / 1000;
      $("pg").value = Math.round(done * 100 / n);
      setSt(`Enhancing frame ${done} of ${n} · about ${fmtT(el / done * (n - done))} left`);
    }
    setSt("Finishing the video…");
    await enc.flush();
    enc.close();

    if (audio) {
      try {
        const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: () => {} });
        ae.configure(audio.cfg);
        const sr = audio.buf.sampleRate, total = Math.min(audio.buf.length, Math.floor(maxDur * sr));
        const step = 4096;
        for (let s = 0; s < total; s += step) {
          const len = Math.min(step, total - s);
          const data = new Float32Array(len * audio.ch);
          for (let c = 0; c < audio.ch; c++) data.set(audio.buf.getChannelData(c).subarray(s, s + len), c * len);
          const ad = new AudioData({ format: "f32-planar", sampleRate: sr, numberOfFrames: len, numberOfChannels: audio.ch, timestamp: Math.round(s * 1e6 / sr), data });
          ae.encode(ad); ad.close();
          while (ae.encodeQueueSize > 8) await sleep(5);
        }
        await ae.flush(); ae.close();
      } catch (e) { /* the video is fine without sound */ }
    }
    muxer.finalize();
    const blob = new Blob([muxer.target.buffer], { type: "video/mp4" });
    const url = URL.createObjectURL(blob);
    $("out").src = url;
    $("dl").href = url;
    $("dl").download = "ClipGrab_AI_" + file.name.replace(/\.[^.]+$/, "").replace(/[^\w-]+/g, "_") + "_" + target + "p.mp4";
    $("res").hidden = false;
    $("pg").value = 100;
    setSt(`Finished in ${fmtT((performance.now() - t0) / 1000)}. ${(blob.size / 1048576).toFixed(1)} MB.`);
  } catch (e) {
    setErr(e.message === "Stopped" ? "" : (e.message || String(e)));
    setSt(e.message === "Stopped" ? "Stopped." : "");
  } finally {
    if (v) URL.revokeObjectURL(v.src);
    busy = false; $("go").disabled = false; $("stop").hidden = true;
  }
};
</script>
</body>
</html>
